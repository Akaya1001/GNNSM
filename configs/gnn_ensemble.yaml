# TwoPassGNN ensemble hyperparameters (reference; scripts/train_gnn.py uses these defaults).
pe_dim: 8

ensemble:                      # the A/C configuration from the paper
  - {name: A, hidden: 256, layers: 5, heads: 8, dropout: 0.15, lr: 1.5e-4}
  - {name: C, hidden: 192, layers: 6, heads: 8, dropout: 0.10, lr: 1.3e-4}

train:
  epochs: 150
  patience: 20
  grad_accum_steps: 4

loss:
  lambda_acy_max: 1.0          # NOTEARS acyclicity weight (linear warmup)
  lambda_root: 0.5
  lambda_latent: 0.3
  aux_weight: 0.3              # pass-1 auxiliary edge loss
  nonadd_case_weight: 2.0     # up-weight non-additive cases
